<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detectified</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@100;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: "Exo 2", sans-serif;
      background: url("https://i.imgur.com/ol1MfVj.gif") no-repeat center center fixed;
      background-size: cover;
      color: white;
      cursor: url("https://i.imgur.com/4b7KkzM.png") 16 16, auto;
      position: relative;
    }

    .main-card {
      width: min(760px, 100%);
      background: rgba(10, 14, 22, 0.8);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.45);
      padding: 30px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 { margin-top: 0; }
    p { margin: 8px 0 16px; }
    .controls, .player-buttons { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    button {
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      background: #38e3be;
      color: #052f28;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { transform: scale(1.03); }
    input[type="range"] { width: 150px; }
    #progressContainer {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0;
    }
    #progressBar { height: 100%; width: 0%; background: #38e3be; }
    #trackInfo { margin-bottom: 10px; font-size: 0.95rem; }

    .secret-area {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #134e4a 0%, #020617 45%, #0b1120 100%);
      z-index: 10;
    }

    .secret-area.show {
      display: flex;
    }

    .secret-panel {
      width: min(700px, 100%);
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(125, 211, 252, 0.25);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,0.45);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .secret-panel::before {
      content: "";
      position: absolute;
      inset: -20% -10% auto;
      height: 140px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22), transparent 70%);
      filter: blur(18px);
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite alternate;
    }

    .secret-panel::after {
      content: "";
      position: absolute;
      inset: auto -10% -20% -10%;
      height: 120px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
      transform: rotate(-6deg);
      pointer-events: none;
    }

    .secret-panel > * {
      position: relative;
      z-index: 1;
    }

    .secret-panel h2 { margin-top: 0; }
    .secret-panel .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #38bdf8;
      color: #052f28;
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(255,255,255,0.8);
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 90px;
      margin: 16px 0 10px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .bar {
      width: 6px;
      border-radius: 999px;
      background: linear-gradient(to top, #38bdf8, #e0f2fe);
      transform-origin: bottom;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="main-card">
    <h1>The (maybe detective) seal's portfolio</h1>

    <div id="trackInfo"><span id="trackTitle">No track selected</span> <span id="trackTime">0:00 / 0:00</span></div>
    <div id="progressContainer"><div id="progressBar"></div></div>

    <div class="player-buttons">
      <button id="playBtn">Play</button>
    </div>

    <div class="controls">
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
      <button id="muteBtn">Mute</button>
      <button id="loopBtn">Loop Off</button>
    </div>
  </div>

  <div id="secretArea" class="secret-area">
    <div class="secret-panel">
      <button id="closeSecretBtn" class="close-btn">Close</button>
      <h2>Ocean secret</h2>
      <p>You've found the hidden area tucked inside the first page.</p>

      <div id="secretTrackInfo"><span id="secretTrackTitle">No track selected</span> <span id="secretTrackTime">0:00 / 0:00</span></div>
      <div id="secretProgressContainer"><div id="secretProgressBar"></div></div>
      <div id="visualizer" class="visualizer"></div>

      <div class="player-buttons">
        <button id="secretPlayBtn">Play</button>
      </div>

      <div class="controls">
        <input type="range" id="secretVolumeSlider" min="0" max="1" step="0.01" value="1">
        <button id="secretMuteBtn">Mute</button>
        <button id="secretLoopBtn">Loop Off</button>
      </div>
    </div>
  </div>

  <script>
    const tracks = [
      { title: "Seal", src: "seal.mp3" }
    ];

    const secretTracks = [
      { title: "Nangs", src: "nangs.mp3" }
    ];

    const audio = new Audio();
    const secretAudio = new Audio();
    let loopEnabled = false;
    let secretLoopEnabled = false;

    const trackTitle = document.getElementById("trackTitle");
    const trackTime = document.getElementById("trackTime");
    const progressBar = document.getElementById("progressBar");
    const playBtn = document.getElementById("playBtn");
    const muteBtn = document.getElementById("muteBtn");
    const loopBtn = document.getElementById("loopBtn");
    const volumeSlider = document.getElementById("volumeSlider");

    const secretArea = document.getElementById("secretArea");
    const secretPanel = document.querySelector(".secret-panel");
    const closeSecretBtn = document.getElementById("closeSecretBtn");
    const secretTrackTitle = document.getElementById("secretTrackTitle");
    const secretTrackTime = document.getElementById("secretTrackTime");
    const secretProgressBar = document.getElementById("secretProgressBar");
    const secretPlayBtn = document.getElementById("secretPlayBtn");
    const secretMuteBtn = document.getElementById("secretMuteBtn");
    const secretLoopBtn = document.getElementById("secretLoopBtn");
    const secretVolumeSlider = document.getElementById("secretVolumeSlider");
    const visualizer = document.getElementById("visualizer");
    const audioContext = window.AudioContext || window.webkitAudioContext;
    const secretAudioContext = new audioContext();
    const secretAnalyser = secretAudioContext.createAnalyser();
    secretAnalyser.fftSize = 64;
    const secretFreqData = new Uint8Array(secretAnalyser.frequencyBinCount);
    let secretSourceNode = null;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, "0")}`;
    }

    function updateTime() {
      const current = audio.currentTime || 0;
      const total = audio.duration || 0;
      trackTime.textContent = `${formatTime(current)} / ${formatTime(total)}`;
      const percent = total ? (current / total) * 100 : 0;
      progressBar.style.width = `${percent}%`;
    }

    function updateSecretTime() {
      const current = secretAudio.currentTime || 0;
      const total = secretAudio.duration || 0;
      secretTrackTime.textContent = `${formatTime(current)} / ${formatTime(total)}`;
      const percent = total ? (current / total) * 100 : 0;
      secretProgressBar.style.width = `${percent}%`;
    }

    function updateTrackInfo() {
      trackTitle.textContent = tracks[0].title;
      trackTime.textContent = "0:00 / 0:00";
    }

    function updateSecretTrackInfo() {
      secretTrackTitle.textContent = secretTracks[0].title;
      secretTrackTime.textContent = "0:00 / 0:00";
    }

    function createDots() {
      const count = 24;
      for (let i = 0; i < count; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.left = `${Math.random() * 100}%`;
        dot.style.top = `${Math.random() * 100}%`;
        dot.style.animation = `drift ${4 + Math.random() * 6}s ease-in-out infinite alternate`;
        secretPanel.appendChild(dot);
      }
    }

    function createVisualizerBars() {
      visualizer.innerHTML = "";
      for (let i = 0; i < 36; i++) {
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = "10px";
        visualizer.appendChild(bar);
      }
    }

    function ensureSecretAudioGraph() {
      if (!secretSourceNode) {
        secretSourceNode = secretAudioContext.createMediaElementSource(secretAudio);
        secretSourceNode.connect(secretAnalyser);
        secretAnalyser.connect(secretAudioContext.destination);
      }
      if (secretAudioContext.state === "suspended") {
        secretAudioContext.resume();
      }
    }

    function animateVisualizer() {
      const bars = visualizer.querySelectorAll(".bar");
      if (!secretAudio.paused && secretAudio.readyState >= 2) {
        secretAnalyser.getByteFrequencyData(secretFreqData);
        bars.forEach((bar, index) => {
          const value = secretFreqData[index] / 255;
          const height = 10 + value * 80;
          bar.style.height = `${Math.max(8, height)}px`;
          bar.style.opacity = `${0.35 + value * 0.8}`;
        });
      } else {
        bars.forEach((bar, index) => {
          const height = 10 + Math.sin((Date.now() / 400) + index * 0.25) * 8;
          bar.style.height = `${Math.max(8, height)}px`;
          bar.style.opacity = "0.35";
        });
      }
      requestAnimationFrame(animateVisualizer);
    }

    function playCurrent() {
      audio.src = tracks[0].src;
      audio.load();
      audio.play().catch(() => {});
      updateTrackInfo();
    }

    function playSecretCurrent() {
      ensureSecretAudioGraph();
      secretAudio.src = secretTracks[0].src;
      secretAudio.load();
      secretAudio.play().catch(() => {});
      updateSecretTrackInfo();
    }

    function togglePlay() {
      if (audio.paused) {
        playCurrent();
        playBtn.textContent = "Pause";
      } else {
        audio.pause();
        playBtn.textContent = "Play";
      }
    }

    function toggleSecretPlay() {
      if (secretAudio.paused) {
        playSecretCurrent();
        secretPlayBtn.textContent = "Pause";
      } else {
        secretAudio.pause();
        secretPlayBtn.textContent = "Play";
      }
    }

    playBtn.addEventListener("click", togglePlay);
    secretPlayBtn.addEventListener("click", toggleSecretPlay);

    createDots();
    createVisualizerBars();
    animateVisualizer();

    audio.addEventListener("timeupdate", updateTime);
    audio.addEventListener("ended", () => {
      if (loopEnabled) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } else {
        playCurrent();
      }
    });

    secretAudio.addEventListener("timeupdate", updateSecretTime);
    secretAudio.addEventListener("ended", () => {
      if (secretLoopEnabled) {
        secretAudio.currentTime = 0;
        secretAudio.play().catch(() => {});
      } else {
        playSecretCurrent();
      }
    });

    muteBtn.addEventListener("click", () => {
      audio.muted = !audio.muted;
      muteBtn.textContent = audio.muted ? "Unmute" : "Mute";
    });

    secretMuteBtn.addEventListener("click", () => {
      secretAudio.muted = !secretAudio.muted;
      secretMuteBtn.textContent = secretAudio.muted ? "Unmute" : "Mute";
    });

    loopBtn.addEventListener("click", () => {
      loopEnabled = !loopEnabled;
      loopBtn.textContent = loopEnabled ? "Loop On" : "Loop Off";
      audio.loop = loopEnabled;
    });

    secretLoopBtn.addEventListener("click", () => {
      secretLoopEnabled = !secretLoopEnabled;
      secretLoopBtn.textContent = secretLoopEnabled ? "Loop On" : "Loop Off";
      secretAudio.loop = secretLoopEnabled;
    });

    volumeSlider.addEventListener("input", () => {
      audio.volume = Number(volumeSlider.value);
    });

    secretVolumeSlider.addEventListener("input", () => {
      secretAudio.volume = Number(secretVolumeSlider.value);
    });

    function revealSecretArea() {
      secretArea.classList.add("show");
      playSecretCurrent();
    }

    closeSecretBtn.addEventListener("click", () => {
      secretArea.classList.remove("show");
      secretAudio.pause();
    });

    let typed = "";
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key.length !== 1) return;
      typed += key;
      if (typed.length > 6) typed = typed.slice(-6);
      if (typed.includes("niko")) {
        revealSecretArea();
      }
    });

    updateTrackInfo();
    updateSecretTrackInfo();
  </script>
  <style>
    @keyframes drift {
      from { transform: translate(0, 0); opacity: 0.3; }
      to { transform: translate(12px, -12px); opacity: 1; }
    }

    @keyframes pulse {
      from { transform: translateY(0); opacity: 0.6; }
      to { transform: translateY(10px); opacity: 1; }
    }
  </style>
</body>
</html>
